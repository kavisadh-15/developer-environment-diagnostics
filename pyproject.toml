[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "developer-environment-diagnostics"
version = "1.0.0"
description = "A CLI tool for checking developer environment health"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
diagnostics = "diagnostics.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]